name: Generate Daily Topics

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

jobs:
  generate-topics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests python-dotenv

      - name: Generate 24 topics
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python generator/topic_generator.py

      - name: Commit generated topics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prompts/*.json topic_history.json
          git commit -m "Generate daily topics" || echo "No changes to commit"
          git push
