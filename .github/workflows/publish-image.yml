name: Publish Image to Instagram

on:
  schedule:
    # 12:30 AM IST
    - cron: "0 19 * * *"

    # 6:30 AM IST
    - cron: "0 1 * * *"

    # 12:30 PM IST
    - cron: "0 7 * * *"

    # 6:30 PM IST
    - cron: "0 13 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-daily-queue
  cancel-in-progress: false

jobs:

  publish-batch:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests python-dotenv

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish 6 posts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          PUBLIC_IMAGE_BASE_URL: https://vighnesh1477.github.io/git2gram/images

        run: |

          for i in 1 2 3 4 5 6
          do

            echo ""
            echo "=========================================="
            echo "POST $i OF 6"
            echo "=========================================="

            if python generator/generate.py; then

              echo ""
              echo "POST $i COMPLETED SUCCESSFULLY"

            else

              echo ""
              echo "POST $i FAILED"
              echo "Stopping this batch."

              exit 1

            fi

            if [ "$i" -lt 6 ]; then

              echo ""
              echo "Waiting 1 hour before the next post..."
              sleep 3600

            fi

          done

          echo ""
          echo "=========================================="
          echo "6-POST BATCH COMPLETED"
          echo "=========================================="
